# =============================================================================
#  Стек: MariaDB + LoginServer + GameServer.
#
#  Образ рантайма берётся готовый, без сборки: сервер — это обычный jar,
#  ему нужна только JRE. Так стенду не требуется ни buildx, ни свой Dockerfile,
#  а значит на одну поломку меньше.
#
#  Собранный сервер лежит на хосте в ./dist и монтируется внутрь.
# =============================================================================

name: l2-interlude-x10

x-l2-common: &l2-common
  # Mobius Interlude компилируется с target 25, поэтому и рантайм нужен 25:
  # на JRE 21 классы просто не загрузятся.
  #
  # Образ вынесен в переменную: если JRE не скачивается (реестр недоступен),
  # можно указать в .env уже скачанный JDK-образ — он тоже умеет запускать jar.
  image: ${L2_RUNTIME_IMAGE:-eclipse-temurin:25-jre-noble}
  restart: unless-stopped
  # Штатный init вместо tini: корректно доставляет SIGTERM в JVM, иначе при
  # остановке сервер убивается по таймауту и персонажи сохраняются не полностью.
  init: true
  entrypoint: ["/opt/l2/bin/entrypoint.sh"]
  stop_grace_period: 90s
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "5"

services:
  db:
    image: mariadb:11.4
    container_name: l2-db
    restart: unless-stopped
    command: >
      --innodb-buffer-pool-size=${DB_BUFFER_POOL:-2G}
      --max-connections=300
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD не задан}
      MARIADB_USER: ${DB_USER:-l2j}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD не задан}
      MARIADB_DATABASE: ${DB_NAME:-l2jmobius}
      TZ: ${TZ:-Europe/Moscow}
    volumes:
      - db-data:/var/lib/mysql
      - db-logs:/var/log/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/l2j.cnf:ro
    ports:
      # Только localhost: база не должна торчать в интернет.
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  login:
    <<: *l2-common
    container_name: l2-login
    command: ["login"]
    environment:
      TZ: ${TZ:-Europe/Moscow}
      L2_ROLE: login
      DB_HOST: db
      DB_PORT: 3306
      JVM_PROFILE: ${JVM_PROFILE:-zgc}
      JVM_HEAP: ${LOGIN_HEAP:-512M}
    volumes:
      - ./docker/entrypoint.sh:/opt/l2/bin/entrypoint.sh:ro
      - ./jvm:/opt/l2/jvm:ro
      - ./dist:/opt/l2/server
    ports:
      - "${LOGIN_PORT:-2106}:2106"
    depends_on:
      db:
        condition: service_healthy

  game:
    <<: *l2-common
    container_name: l2-game
    command: ["game"]
    environment:
      TZ: ${TZ:-Europe/Moscow}
      L2_ROLE: game
      DB_HOST: db
      DB_PORT: 3306
      JVM_PROFILE: ${JVM_PROFILE:-zgc}
      JVM_HEAP: ${GAME_HEAP:-4G}
    volumes:
      - ./docker/entrypoint.sh:/opt/l2/bin/entrypoint.sh:ro
      - ./jvm:/opt/l2/jvm:ro
      - ./dist:/opt/l2/server
    ports:
      - "${GAME_PORT:-7777}:7777"
    depends_on:
      db:
        condition: service_healthy
      login:
        condition: service_started

  adminer:
    image: adminer:5
    container_name: l2-adminer
    restart: unless-stopped
    profiles: ["tools"]
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  db-logs:
