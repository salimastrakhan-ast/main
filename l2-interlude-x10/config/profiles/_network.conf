# =============================================================================
#  Сеть и база. Применяется ВСЕГДА, поверх любого профиля рейтов.
#  Значения подставляются из .env — руками тут править обычно нечего.
#
#  Адрес, который клиент получает для входа в мир, задаётся НЕ здесь,
#  а файлом game/config/ipconfig.xml — его пишет scripts/configure.sh.
# =============================================================================

# --- Игровой сервер ----------------------------------------------------------
[game]

Server.ini : !GameserverHostname = 0.0.0.0
Server.ini : !GameserverPort     = 7777

# Связка гейм <-> логин внутри docker-сети: 'login' — имя контейнера.
Server.ini : !LoginHost         = login
Server.ini : !LoginPort         = 9014
Server.ini : RequestServerID    = ${L2_SERVER_ID:-1}
Server.ini : AcceptAlternateID  = True
Server.ini : MaximumOnlineUsers = ${L2_MAX_ONLINE:-2000}

# Версия протокола клиента Interlude. Меняется только вместе с хроникой.
Server.ini : ?AllowedProtocolRevisions = 746

# База. Порт 3306 — внутри docker-сети; DB_PORT из .env это порт на хосте.
Database.ini : !URL      = jdbc:mysql://${DB_HOST:-db}:3306/${DB_NAME:-l2jmobius}?useUnicode=true&characterEncoding=utf-8&allowPublicKeyRetrieval=true&useSSL=false&connectTimeout=10000&interactiveClient=true&sessionVariables=wait_timeout=600,interactive_timeout=600&autoReconnect=true&rewriteBatchedStatements=true
Database.ini : !Login    = ${DB_USER:-l2j}
Database.ini : !Password = ${DB_PASSWORD}
Database.ini : ?MaximumDatabaseConnections = 50

# --- Логин-сервер ------------------------------------------------------------
[login]

Server.ini : !LoginserverHostname = 0.0.0.0
Server.ini : !LoginserverPort     = 2106

# Порт, на котором логин принимает регистрацию игровых серверов.
Server.ini : !LoginHostname = 0.0.0.0
Server.ini : !LoginPort     = 9014

# Аккаунт создаётся при первом входе с новым логином и паролем.
# Для закрытого сервера поставь False.
Server.ini : AutoCreateAccounts = True

# Разрешает игровому серверу зарегистрироваться самому — иначе пришлось бы
# вручную генерировать hexid через GameServerRegister.sh.
Server.ini : AcceptNewGameServer = True

Server.ini : ?ShowLicence = True
Server.ini : ?LoginTryBeforeBan = 5
Server.ini : ?LoginBlockAfterBan = 900

# У Mobius Interlude логин и гейм работают с ОДНОЙ базой.
Database.ini : !URL      = jdbc:mysql://${DB_HOST:-db}:3306/${DB_NAME:-l2jmobius}?useUnicode=true&characterEncoding=utf-8&allowPublicKeyRetrieval=true&useSSL=false&connectTimeout=10000&interactiveClient=true&sessionVariables=wait_timeout=600,interactive_timeout=600&autoReconnect=true
Database.ini : !Login    = ${DB_USER:-l2j}
Database.ini : !Password = ${DB_PASSWORD}
Database.ini : ?MaximumDatabaseConnections = 5
