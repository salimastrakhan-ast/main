# =============================================================================
#  Сеть и база. Применяется ВСЕГДА, поверх любого профиля рейтов.
#  Значения подставляются из .env — руками тут править обычно нечего.
# =============================================================================

# --- GameServer --------------------------------------------------------------
[game]

# Слушаем все интерфейсы внутри контейнера, наружу порт пробрасывает Docker.
Server.ini : GameserverHostname = 0.0.0.0
Server.ini : GameserverPort     = 7777

# Адрес, который игровой сервер сообщает логин-серверу, а тот — клиенту.
# Если тут останется 127.0.0.1, друзья увидят сервер в списке,
# но при входе в мир будут висеть на "Connecting..." — это причина №1
# у всех, кто поднимает L2 впервые.
Server.ini : ExternalHostname   = ${L2_EXTERNAL_IP}
Server.ini : InternalHostname   = ${L2_INTERNAL_IP:-127.0.0.1}

# Связка гейм <-> логин внутри docker-сети: 'login' — имя контейнера.
Server.ini : LoginHost          = login
Server.ini : LoginPort          = 9014
Server.ini : RequestServerID    = ${L2_SERVER_ID:-1}
Server.ini : AcceptAlternateID  = True

Server.ini : MaximumOnlineUsers = ${L2_MAX_ONLINE:-2000}

# База. Порт всегда 3306: это порт внутри docker-сети, а DB_PORT из .env —
# порт на хосте, он к строке подключения отношения не имеет.
# rewriteBatchedStatements серьёзно ускоряет пакетные сохранения L2J.
Server.ini : !URL      = jdbc:mysql://${DB_HOST:-db}:3306/${DB_GAME_NAME:-l2jgs}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true&serverTimezone=${TZ:-Europe/Moscow}
Server.ini : !Login    = ${DB_USER:-l2j}
Server.ini : !Password = ${DB_PASSWORD}
Server.ini : ?MaximumDbConnections = 100

# --- LoginServer -------------------------------------------------------------
[login]

LoginServer.ini : LoginserverHostname = 0.0.0.0
LoginServer.ini : LoginserverPort     = 2106

# Порт для регистрации игровых серверов (внутренний, наружу не пробрасывается).
LoginServer.ini : LoginHostname = 0.0.0.0
LoginServer.ini : LoginPort     = 9014

# Аккаунт создаётся при первом входе с новым логином/паролем.
# Для закрытого сервера поставь False и заводи аккаунты скриптом.
LoginServer.ini : AutoCreateAccounts = True

# Разрешает игровому серверу зарегистрироваться самому.
# Иначе пришлось бы вручную генерировать hexid и переносить файл.
LoginServer.ini : ?AcceptNewGameServer = True

LoginServer.ini : ?ShowLicence = True

LoginServer.ini : !URL      = jdbc:mysql://${DB_HOST:-db}:3306/${DB_LOGIN_NAME:-l2jls}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=${TZ:-Europe/Moscow}
LoginServer.ini : !Login    = ${DB_USER:-l2j}
LoginServer.ini : !Password = ${DB_PASSWORD}
LoginServer.ini : ?MaximumDbConnections = 20

# Защита от перебора паролей.
LoginServer.ini : ?LoginTryBeforeBan = 5
LoginServer.ini : ?LoginBlockAfterBan = 600
