# =============================================================================
#  Ретейл x1 — эталонная база для сравнения.
#
#  Зачем нужен: когда кажется, что "сборка багованная", первым делом
#  прогоняют этот профиль. Если на x1 поведение верное, а на x10 нет —
#  проблема в рейтах и балансе, а не в эмуляторе.
#
#      ./scripts/configure.sh --profile retail-x1
# =============================================================================

[game]

Rates.ini : !RateXp = 1
Rates.ini : !RateSp = 1
Rates.ini : ?RatePartyXp = 1
Rates.ini : ?RatePartySp = 1
Rates.ini : ?RateDropAdena = 1

Rates.ini : ?DeathDropChanceMultiplier = 1
Rates.ini : ?DeathDropAmountMultiplier = 1
Rates.ini : ?CorpseDropChanceMultiplier = 1
Rates.ini : ?CorpseDropAmountMultiplier = 1
Rates.ini : ?HerbDropChanceMultiplier = 1
Rates.ini : ?HerbDropAmountMultiplier = 1
Rates.ini : ?RaidDropChanceMultiplier = 1
Rates.ini : ?RaidDropAmountMultiplier = 1

Rates.ini : ?RateDropItems = 1
Rates.ini : ?RateDropSpoil = 1
Rates.ini : ?RateRaidDropItems = 1

Rates.ini : ?RateQuestDrop = 1
Rates.ini : ?RateQuestReward = 1
Rates.ini : ?RateQuestRewardXP = 1
Rates.ini : ?RateQuestRewardSP = 1
Rates.ini : ?RateQuestRewardAdena = 1

Rates.ini : ?RateConsumableCost = 1
Rates.ini : ?RateExtractable = 1
Rates.ini : ?RateDropManor = 1

Character.ini : ?AutoLoot = False
Character.ini : ?AutoLootHerbs = False
Character.ini : ?AutoLootRaids = False
Character.ini : ?AutoLearnSkills = False
General.ini   : ?AutoLoot = False
General.ini   : ?AutoLootHerbs = False
