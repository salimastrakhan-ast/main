# =============================================================================
#  x10 "классик": опыт, SP и адена x10, дроп ~x10 по итогу, механики — ретейл.
#
#  Ключи выверены по L2J_Mobius_CT_0_Interlude. Имена конфигов у Mobius свои:
#  рейты в Rates.ini, а автолут и обучение скиллам — в Player.ini,
#  не в Character.ini, как в старых сборках L2J.
#
#  Посмотреть, что применится, ничего не меняя:
#      ./scripts/configure.sh --dry-run
# =============================================================================

[game]

# --- Опыт и SP ---------------------------------------------------------------
Rates.ini : !RateXp = 10
Rates.ini : !RateSp = 10

# Групповые множители. Если в пати опыт полетит как x100 — значит в твоей
# ревизии они перемножаются с RateXp: поставь тут 1.
Rates.ini : RatePartyXp = 10
Rates.ini : RatePartySp = 10

# --- Адена -------------------------------------------------------------------
# Отдельного RateDropAdena у Mobius нет: адена настраивается через множитель
# по id предмета. 57 — это адена, остальные id (6656-6662, 8191) — камни
# жизни и прочее, их оставляем ретейльными.
Rates.ini : DropAmountMultiplierByItemId = 57,10;6656,1;6657,1;6658,1;6659,1;6660,1;6661,1;6662,1;8191,1

# --- Дроп с мобов ------------------------------------------------------------
# Шанс x5 и количество x2 дают примерно x10 итогового лута, но редкие вещи
# остаются редкими. Хочешь "честный x10 по шансу" — Chance = 10, Amount = 1.
Rates.ini : DeathDropChanceMultiplier = 5
Rates.ini : DeathDropAmountMultiplier = 2

# --- Спойл -------------------------------------------------------------------
Rates.ini : SpoilDropChanceMultiplier = 5
Rates.ini : SpoilDropAmountMultiplier = 2

# --- Травы -------------------------------------------------------------------
Rates.ini : HerbDropChanceMultiplier = 2
Rates.ini : HerbDropAmountMultiplier = 1

# --- Рейд-боссы --------------------------------------------------------------
# Здесь x10 не нужен: дроп с РБ — основа экономики. x2 ощущается,
# но не обваливает цены за первую неделю.
Rates.ini : RaidDropChanceMultiplier = 2
Rates.ini : RaidDropAmountMultiplier = 1

# --- Квесты ------------------------------------------------------------------
Rates.ini : RateQuestRewardXP    = 10
Rates.ini : RateQuestRewardSP    = 10
Rates.ini : RateQuestRewardAdena = 10
Rates.ini : QuestItemDropAmountMultiplier = 5
Rates.ini : ?RateQuestReward = 2

# --- Ретейл-значения, которые НЕ трогаем -------------------------------------
Rates.ini : ?RateExtractable = 1.
Rates.ini : ?RateDropManor = 1
Rates.ini : ?RateKarmaExpLost = 1
Rates.ini : ?RateSiegeGuardsPrice = 1
Rates.ini : ?PetXpRate = 10

# --- Механики: классик -------------------------------------------------------
# Автолут выключен, как на офе. Травы подбираются автоматически — иначе
# в бою их физически не успеть поднять. Это единственная поблажка.
Player.ini : AutoLoot = False
Player.ini : AutoLootHerbs = True
Player.ini : AutoLootRaids = False

# Скиллы учим за SP у нпц — это классик. True сделает сервер "лёгким".
Player.ini : AutoLearnSkills = False

# --- Производительность ------------------------------------------------------
# Пулы потоков по числу ядер (-1 = авто). Ручной подбор почти всегда хуже.
Threads.ini : ?ScheduledThreadPoolSize = -1
Threads.ini : ?InstantThreadPoolSize = -1

# Геодата: без неё мобы ходят сквозь стены и "телепортируются" — то, что
# игроки называют лагами. Файлы геодаты нужно положить самому,
# см. docs/CLIENT-SETUP.md.
GeoEngine.ini : PathFinding = 2
GeoEngine.ini : GeoDataPath = ./data/geodata/
