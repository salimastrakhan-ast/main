# =============================================================================
#  x10 "классик": опыт и адена x10, дроп ~x10 по итогу, механики — ретейл.
#
#  Философия профиля: ускоряем прокачку, но НЕ ломаем экономику и не
#  превращаем сервер в фан. Всё, что делает сборку "не Interlude"
#  (заточки под +30, кастомные шмотки, автолут рейдов), оставлено выключенным.
#
#  Проверить, что применится, ничего не меняя:
#      ./scripts/configure.sh --dry-run
# =============================================================================

[game]

# --- Опыт и SP ---------------------------------------------------------------
Rates.ini : !RateXp = 10
Rates.ini : !RateSp = 10

# ВНИМАНИЕ: в большинстве ревизий это АЛЬТЕРНАТИВА RateXp (применяется вместо
# него при убийстве в группе), но в части форков множители перемножаются.
# Проверь на месте: если в пати опыт летит как x100 — поставь тут 1.
Rates.ini : ?RatePartyXp = 10
Rates.ini : ?RatePartySp = 10

# --- Адена -------------------------------------------------------------------
Rates.ini : ?RateDropAdena = 10

# --- Дроп с мобов ------------------------------------------------------------
# Шанс x5 и количество x2 дают примерно x10 итогового лута, но при этом
# редкие вещи остаются редкими, а стаки не раздуваются до абсурда.
# Хочешь "честный x10 по шансу" — поставь Chance = 10, Amount = 1.
Rates.ini : ?DeathDropChanceMultiplier = 5
Rates.ini : ?DeathDropAmountMultiplier = 2

# Старое именование (ревизии до ~2019). Одно из двух семейств применится,
# второе будет тихо пропущено — так профиль работает на любой сборке.
Rates.ini : ?RateDropItems = 10

# --- Спойл -------------------------------------------------------------------
Rates.ini : ?CorpseDropChanceMultiplier = 5
Rates.ini : ?CorpseDropAmountMultiplier = 2
Rates.ini : ?RateDropSpoil = 10

# --- Травы -------------------------------------------------------------------
Rates.ini : ?HerbDropChanceMultiplier = 2
Rates.ini : ?HerbDropAmountMultiplier = 1
Rates.ini : ?RateDropCommonHerbs = 2

# --- Рейд-боссы --------------------------------------------------------------
# Здесь x10 категорически не нужен: дроп с РБ — основа экономики сервера.
# x2 по шансу ощущается, но не обваливает цены за первую неделю.
Rates.ini : ?RaidDropChanceMultiplier = 2
Rates.ini : ?RaidDropAmountMultiplier = 1
Rates.ini : ?RateRaidDropItems = 2

# --- Квесты ------------------------------------------------------------------
Rates.ini : ?RateQuestDrop = 5
Rates.ini : ?RateQuestReward = 2
Rates.ini : ?RateQuestRewardXP = 10
Rates.ini : ?RateQuestRewardSP = 10
Rates.ini : ?RateQuestRewardAdena = 10

# --- Ретейл-значения, которые НЕ трогаем -------------------------------------
# Расход соул/спирит шотов — как на офе: иначе ломается вся экономика D-C грейда.
Rates.ini : ?RateConsumableCost = 1
Rates.ini : ?RateExtractable = 1
Rates.ini : ?RateDropManor = 1
Rates.ini : ?RateKarmaExpLost = 1
Rates.ini : ?RateSiegeGuardsPrice = 1

# --- Механики: классик ---------------------------------------------------------
# Автолут выключен — как на офе. Травы подбираются автоматически, иначе
# в бою их физически не успеть поднять (это единственная поблажка).
Character.ini : ?AutoLoot = False
Character.ini : ?AutoLootHerbs = True
Character.ini : ?AutoLootRaids = False
General.ini   : ?AutoLoot = False
General.ini   : ?AutoLootHerbs = True
General.ini   : ?AutoLootRaids = False

# Скиллы учим за SP у нпц — это классик. True сделает сервер "лёгким".
Character.ini : ?AutoLearnSkills = False

# --- Заточка: ретейл ---------------------------------------------------------
# Значения ниже = офф Interlude. Раскомментируй и правь, если хочешь
# сделать заточку мягче. Помни: заточка — самый быстрый способ убить
# экономику x10-сервера.
#Character.ini : ?EnchantChanceElementStone = 50
#Character.ini : ?EnchantChanceWeapon = 66
#Character.ini : ?EnchantChanceArmor = 66
#Character.ini : ?EnchantChanceJewelry = 66
#Character.ini : ?BlessedEnchantChanceWeapon = 66
#Character.ini : ?EnchantSafeMax = 3
#Character.ini : ?EnchantSafeMaxFull = 4

# --- Производительность ------------------------------------------------------
# Пулы потоков по числу ядер (-1 = авто). Ручной подбор почти всегда хуже.
General.ini : ?ScheduledThreadPoolCount = -1
General.ini : ?InstantThreadPoolCount = -1

# Геодата: без неё мобы ходят сквозь стены, стреляют через скалы и
# "телепортируются" — то, что игроки называют лагами. Файлы геодаты
# нужно положить самому, см. docs/CLIENT-SETUP.md.
GeoEngine.ini : ?PathFinding = 2
GeoEngine.ini : ?GeoDataPath = ./data/geodata/
