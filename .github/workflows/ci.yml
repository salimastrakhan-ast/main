name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Бэкенд
    runs-on: ubuntu-latest

    # Интеграционные тесты идут против настоящих Postgres и Redis: проверяется
    # ровно то, что делает база, и на заглушках это прошло бы в сломанном виде.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tito
          POSTGRES_PASSWORD: tito
          POSTGRES_DB: tito
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U tito -d tito"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ['6380:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: server/go.sum

      - name: Форматирование
        working-directory: server
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Не отформатировано: $unformatted"
            exit 1
          fi

      - name: Статический анализ
        working-directory: server
        run: go vet ./...

      - name: Тесты
        working-directory: server
        run: go test ./... -count=1 -race

  app:
    name: Клиент
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true

      - name: Зависимости
        working-directory: app
        run: flutter pub get

      - name: Кодогенерация
        working-directory: app
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Анализатор
        working-directory: app
        run: flutter analyze

      - name: Тесты
        working-directory: app
        run: flutter test

      - name: Сборка под веб
        working-directory: app
        run: flutter build web --release

      # APK собираем здесь, потому что локально Android SDK есть не у всех.
      - name: Сборка APK
        working-directory: app
        run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn
