name: APK для стенда

# Общий CI собирает APK без адреса сервера, и такое приложение стучится в
# localhost. Здесь адрес зашивается при сборке (TITO_API), и APK сразу
# работает со стендом.
on:
  push:
    branches: [claude/tito-apk-build]
  workflow_dispatch:
    inputs:
      api:
        description: Адрес сервера (TITO_API)
        required: true
        default: https://tito.5-39-250-63.sslip.io:8448

jobs:
  apk:
    name: APK
    runs-on: ubuntu-latest
    env:
      # Через env, а не подстановкой в run: ввод из формы не попадёт в скрипт.
      TITO_API: ${{ inputs.api || 'https://tito.5-39-250-63.sslip.io:8448' }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true

      # Ключ подписи стенда. Без него APK подписывается отладочным ключом
      # раннера, который на каждом прогоне свой, и обновление не встаёт поверх
      # прошлой установки.
      - name: Ключ подписи
        if: env.KEYSTORE != ''
        working-directory: app/android
        env:
          KEYSTORE: ${{ secrets.TITO_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TITO_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 -d > tito-stand.jks
          cat > key.properties <<PROPS
          storeFile=tito-stand.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=tito
          keyPassword=$KEYSTORE_PASSWORD
          PROPS

      - name: Зависимости
        working-directory: app
        run: flutter pub get

      - name: Кодогенерация
        working-directory: app
        run: dart run build_runner build --delete-conflicting-outputs

      # Flutter установлен здесь и больше нигде: на машине, с которой идёт
      # выкладка, его нет, поэтому тесты клиента гоняются в этой же сборке.
      - name: Тесты
        working-directory: app
        run: flutter test

      # Один APK на все архитектуры: ссылку можно дать любому, не выясняя,
      # какой у него телефон.
      - name: Сборка APK
        working-directory: app
        run: flutter build apk --release --dart-define=TITO_API="$TITO_API"

      - uses: actions/upload-artifact@v4
        with:
          name: tito-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
