# coturn для звонков Tito.
#
# Секрет, realm и внешний адрес передаются флагами из docker-compose.prod.yml:
# им место в .env, а не в файле под контролем версий.

listening-port=3478
# TLS-порт закомментирован намеренно: без сертификата coturn на нём не
# поднимется и утянет за собой весь контейнер. Включайте вместе с
# cert/pkey ниже, когда положите сертификат рядом.
# tls-listening-port=5349

# Диапазон релейных портов. Каждый разговор занимает несколько; сотня с
# запасом покрывает небольшую установку, и именно эти порты надо открыть в
# фаерволе по UDP.
min-port=49160
max-port=49200

# Временные пароли: логин — срок годности, пароль — подпись логина общим
# секретом. Постоянных учётных записей нет вовсе, поэтому вытащенный из
# приложения пароль протухает сам и открытым релеем не становится.
use-auth-secret

fingerprint
no-cli
no-multicast-peers

# Запрет пересылки внутрь частных сетей. Без него TURN становится способом
# постучаться из интернета в вашу локальную сеть — от базы данных до
# роутера — чужими руками и с вашего адреса.
no-loopback-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Сколько одновременных соединений разрешено одному клиенту. Защита от
# случая, когда сломанный клиент открывает их без счёта.
user-quota=12
total-quota=1200

# TLS — когда положите сертификат:
# cert=/etc/coturn/cert.pem
# pkey=/etc/coturn/key.pem
